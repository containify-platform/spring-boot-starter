spring.application.name=spring-boot-starter

# Containify doesn't set PORT: the template sets it, and the endpoint points at the same port.
server.port=${PORT:8080}

# HTTPS ends at Containify's edge, which forwards requests over HTTP with
# X-Forwarded-Proto and X-Forwarded-For.
server.forward-headers-strategy=framework

# The database comes from SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and
# SPRING_DATASOURCE_PASSWORD. These defaults suit a local Postgres.
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres

# Flyway applies src/main/resources/db/migration when the app starts.
# /actuator/health is the health check; it answers 503 when the database can't be reached.
